# oos-rpi-lcd35 settings. Every line is optional; the values shown are the defaults.
# Apply changes with: sudo systemctl restart oos-rpi-lcd35

# Seconds each page stays on screen (2 to 3600). HOLD on the touch bar pauses rotation.
page_interval = 5

# Pages to show, in this order. Leave one out to hide it.
# Available: system, network, sensors, docker, services, identity
pages = system, network, sensors, docker, services, identity

# systemd units listed on the Services page. Units that do not exist on this
# machine are skipped, so the list can be generous.
services = ssh, docker, nginx, apache2, mysql, mariadb, postgresql, redis, mosquitto, oos-rpi-lcd35

# Filesystem shown in the DISK card and watched for the "DISK nn%" alert
disk = /

# Framebuffer of the display. Default: the first 480x320 framebuffer found.
#display = /dev/fb1

# Touch input device. Default: the first touchscreen found.
#touch = /dev/input/event0

# Virtual terminal that shares the display; CONSOLE on the touch bar hands the
# screen to it.
console_tty = /dev/tty1

# Touch calibration. Run "sudo oos-rpi-lcd35 --calibrate" (with the service stopped)
# and paste the lines it prints here. Default: the ranges the driver reports.
#touch_swap_xy = no
#touch_min_x = 0
#touch_max_x = 4095
#touch_min_y = 0
#touch_max_y = 4095
